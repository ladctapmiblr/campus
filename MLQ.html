<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Survey</title>
<style>
  *{box-sizing:border-box}
  :root{
	--bg:#f4f6fb;
	--card:#ffffff;
	--ink:#1f2430;
	--muted:#6b7280;
	--line:#e3e7ef;
	--accent:#3b5bfd;
    --accent-soft:#eef1ff;
	--danger:#d64545;
  }
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
	color:var(--ink);
	font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
	padding:24px 16px 140px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:860px;margin:0 auto}
 
  /* ---------- header ---------- */
  .top{margin-bottom:20px}
  .top h1{font-size:24px;margin:0 0 4px}
  .top .sub{margin:0 0 14px;color:var(--muted);font-size:14px}
  .progress{height:8px;background:#e6e9f2;border-radius:99px;overflow:hidden}
  .progress .bar{height:100%;width:20%;background:var(--accent);border-radius:99px;transition:width .25s ease}
  .pagemeta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:6px;font-weight:600}
 
  /* ---------- name block ---------- */
  .nameblock{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:16px;margin-bottom:14px;
  }
  .nameblock label{display:block;font-weight:600;margin-bottom:8px}
  .nameblock input{
    width:100%;padding:11px 12px;font-size:16px;font-family:inherit;
	border:1px solid var(--line);border-radius:10px;outline:none;background:#fbfcff;color:var(--ink);
  }
  .nameblock input:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px var(--accent-soft)}
  .nameblock input.missing-input{border-color:var(--danger);background:#fff5f5}
 
  /* ---------- question card ---------- */
  .q{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:16px;margin:0 0 12px;
  }
  .q.missing{border-color:var(--danger);box-shadow:0 0 0 3px #fdecec}
  .qtext{margin:0 0 12px;font-weight:600;font-size:15.5px}
 
  .scale{display:flex;gap:8px}
  .opt{
    position:relative;flex:1 1 0;min-width:0;
    display:flex;align-items:center;justify-content:center;
	padding:11px 0;border:1px solid var(--line);border-radius:10px;
    background:#fbfcff;cursor:pointer;user-select:none;
    transition:background .15s,border-color .15s,color .15s;
  }
  .opt input{position:absolute;opacity:0;width:0;height:0;margin:0}
  .opt .num{font-weight:700;font-size:15px;color:var(--muted)}
  .opt:hover{border-color:var(--accent);background:var(--accent-soft)}
  .opt:has(input:checked){background:var(--accent);border-color:var(--accent)}
  .opt:has(input:checked) .num{color:#fff}
  .opt input:focus-visible + .num{outline:2px solid var(--accent);outline-offset:6px;border-radius:4px}
 
  .legend{
    font-size:12.5px;color:var(--muted);margin:0 0 12px;
    background:#eef1ff;border:1px solid #dde3ff;border-radius:10px;
	padding:8px 12px;text-align:center;font-weight:600;
  }
 
  /* ---------- bottom bar ---------- */
  .bottom{
    position:fixed;left:0;right:0;bottom:0;z-index:20;
    background:rgba(255,255,255,.95);
    backdrop-filter:blur(8px);
	border-top:1px solid var(--line);
  }
  .bottom .inner{
    max-width:860px;margin:0 auto;padding:10px 16px;
    display:flex;align-items:center;gap:12px;
  }
  .alert{color:var(--danger);font-size:13.5px;font-weight:700}
  .btns{display:flex;gap:10px;margin-left:auto}
  .btn{
    font:inherit;font-weight:600;font-size:15px;
	padding:11px 22px;border-radius:10px;border:1px solid var(--accent);
    background:var(--accent);color:#fff;cursor:pointer;transition:opacity .15s,background .15s;
  }
  .btn:hover{opacity:.9}
  .btn.ghost{background:#fff;color:var(--accent)}
  .btn.ghost:hover{background:var(--accent-soft);opacity:1}
  .btn[disabled]{opacity:.55;cursor:not-allowed}
  .btn[hidden]{display:none}
 
  /* ---------- done screen ---------- */
  .done{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
	padding:48px 24px;text-align:center;
  }
  .done h2{margin:0 0 8px;font-size:22px}
  .done p{margin:0;color:var(--muted)}
 
  @media (max-width:520px){
	.q{padding:14px}
	.scale{gap:5px}
	.opt{padding:10px 0;border-radius:8px}
	.opt .num{font-size:14px}
	.btn{padding:10px 16px;font-size:14px}
  }
</style>
</head>
<body>
 
<div class="wrap">
  <header class="top">
    <h1>Survey</h1>
	<p class="sub">Please answer every statement on each page.</p>
	<div class="progress"><div class="bar" id="bar"></div></div>
	<div class="pagemeta">
  	<span id="pageLabel">Page 1 of 5</span>
  	<span id="pct">20%</span>
	</div>
  </header>
 
  <form id="survey" novalidate></form>
 
  <div id="done" class="done" hidden>
	<h2>Thank you!</h2>
	<p>Your responses have been submitted.</p>
  </div>
</div>
 
<div class="bottom" id="bottomBar">
  <div class="inner">
	<span class="alert" id="alert" role="alert" aria-live="polite"></span>
	<div class="btns">
  	<button type="button" class="btn ghost" id="prevBtn" hidden>Back</button>
  	<button type="button" class="btn" id="nextBtn">Next</button>
  	<button type="button" class="btn" id="submitBtn" hidden>Submit</button>
	</div>
  </div>
</div>
 
<script>
/* ============================================================
   1) CONFIGURATION — Google Form target
   ============================================================
   formAction : your form's POST endpoint
                https://docs.google.com/forms/d/e/<FORM_ID>/formResponse
   nameEntry  : the entry ID for the "Name" short-answer question
   ============================================================ */
const CONFIG = {
  formAction: "https://docs.google.com/forms/d/e/PASTE_YOUR_FORM_ID_HERE/formResponse",
  nameEntry:  "entry.1000000"   // <-- Name question entry ID
};
 
/* ============================================================
   2) QUESTIONS + GOOGLE FORM ENTRY IDs
   ------------------------------------------------------------
   Replace each "entry.1000xxx" with the real entry ID from
   your Google Form (Get pre-filled link -> inspect the URL).
   Every line = one question, its text and its entry ID.
   ============================================================ */
const QUESTIONS = [
  /* ---------- PAGE 1 : Q1 – Q20 ---------- */
 { id: "1", text: "I provide others with assistance in exchange for their efforts", entry: "entry.1008893045" },
{ id: "2", text: "I re-examine critical assumptions and question whether they are appropriate", entry: "entry.1238885255" },
{ id: "3", text: "I don’t interfere until problems become serious", entry: "entry.2116387498" },
{ id: "4", text: "I focus attention on irregularities, mistakes, exceptions, and deviations from standard", entry: "entry.74751801" },
{ id: "5", text: "I avoid getting involved when important issues arise", entry: "entry.696057925" },
{ id: "6", text: "I talk about my most important values and beliefs", entry: "entry.1877855571" },
{ id: "7", text: "I am absent when needed", entry: "entry.1015252114" },
{ id: "8", text: "I seek differing perspectives when solving problems", entry: "entry.400434799" },
{ id: "9", text: "I talk optimistically about the future to those who are working for me", entry: "entry.1932346655" },
{ id: "10", text: "I instill pride in others for being associated with me", entry: "entry.890821869" },
{ id: "11", text: "I discuss in specific terms who is responsible for achieving performance targets", entry: "entry.838419170" },
{ id: "12", text: "I wait for things to go wrong before taking action", entry: "entry.115980309" },
{ id: "13", text: "I talk enthusiastically about what needs to be accomplished", entry: "entry.1484326875" },
{ id: "14", text: "I specify the importance of having a strong sense of purpose.", entry: "entry.26862428" },
{ id: "15", text: "I spend time teaching and coaching", entry: "entry.1819779438" },
{ id: "16", text: "I make clear what one can expect to receive when performance goals are achieved", entry: "entry.1757035088" },
{ id: "17", text: "I show and tell others that I am a firm believer in “If it is not broke, don’t fix it.”", entry: "entry.495435826" },
{ id: "18", text: "I go beyond self-interest for the good of the group", entry: "entry.2085161989" },
{ id: "19", text: "I treat others as “individuals” rather than just as a member of a group", entry: "entry.1177680423 },
{ id: "20", text: "I demonstrate to others that problems must become chronic before I take action", entry: "entry.428257929" },
 
  /* ---------- PAGE 2 : Q21 – Q40 ---------- */
{ id: "21", text: "I act in ways that build others’ respect for me", entry: "entry.152236361" },
{ id: "22", text: "I concentrate my full attention on dealing with mistakes, complaints, and failures", entry: "entry.547263674" },
{ id: "23", text: "I consider the moral and ethical consequences of decisions", entry: "entry.652633051" },
{ id: "24", text: "I keep track of all mistakes", entry: "entry.942838212" },
{ id: "25", text: "I display a sense of power and confidence", entry: "entry.272923451" },
{ id: "26", text: "I articulate a compelling vision of the future", entry: "entry.448418756" },
{ id: "27", text: "I direct my attention toward failures to meet standard", entry: "entry.1237707358" },
{ id: "28", text: "I avoid making decisions", entry: "entry.559586092" },
{ id: "29", text: "I consider an individual as having different needs, abilities, and aspirations from others", entry: "entry.822897144" },
{ id: "30", text: "I get others to look at problems from many different angles", entry: "entry.263039403" },
{ id: "31", text: "I help others to develop their strengths", entry: "entry.1393239099" },
{ id: "32", text: "I suggest new ways of looking at how to complete assignments", entry: "entry.1057389993" },
{ id: "33", text: "I delay responding to urgent questions", entry: "entry.1704335524" },
{ id: "34", text: "I emphasize the importance of having a collective sense of mission", entry: "entry.1704246359" },
{ id: "35", text: "I express satisfaction when others meet expectations", entry: "entry.1562313718" },
{ id: "36", text: "I express confidence that goals will be achieved", entry: "entry.1240350353" },
{ id: "37", text: "I am effective in meeting others’ job-related needs", entry: "entry.1868928018" },
{ id: "38", text: "I use methods of leadership that are satisfying", entry: "entry.84556955" },
{ id: "39", text: "I get others to do more than they expected to do", entry: "entry.1931121497" },

 
  /* ---------- PAGE 3 : Q41 – Q47 ---------- */
 { id: "40", text: "I am effective in representing others to higher authority", entry: "entry.755905984" },
{ id: "41", text: "I work with others in a satisfactory way", entry: "entry.1340151429” },
{ id: "42", text: "I heighten others’ desire to succeed", entry: "entry.1236789664" },
{ id: "43", text: "I am effective in meeting organizational requirement", entry: "entry.1185413905" },
{ id: "44", text: "I increase others’ willingness to try harder", entry: "entry.209874568" },
{ id: "45", text: "I lead a group that is effective", entry: "entry.53388127" }

];
 
/* ============================================================
   3) LIKERT SCALE
   ============================================================ */
const LIKERT = [
  "Not at all",   // 1
  "Once in a while",            // 2
  "Sometimes",   // 3
  "Fairly often",             // 4
  "Somewhat agree",  	// 5
  "Frequently, if not always",               // 6
];
 
/* ============================================================
   4) APP
   ============================================================ */
const PER_PAGE = 20;
const TOTAL_PAGES = Math.ceil(QUESTIONS.length / PER_PAGE);
 
const form   	= document.getElementById("survey");
const bar    	= document.getElementById("bar");
const pageLabel  = document.getElementById("pageLabel");
const pctLabel   = document.getElementById("pct");
const prevBtn	= document.getElementById("prevBtn");
const nextBtn	= document.getElementById("nextBtn");
const submitBtn  = document.getElementById("submitBtn");
const alertBox   = document.getElementById("alert");
const bottomBar  = document.getElementById("bottomBar");
const doneScreen = document.getElementById("done");
 
let page = 1;
 
/* -------- helpers -------- */
function pageQuestions(p) {
  return QUESTIONS.slice((p - 1) * PER_PAGE, p * PER_PAGE);
}
 
function pageOfQid(qid) {
  const idx = QUESTIONS.findIndex(q => q.id === qid);
  return idx < 0 ? 1 : Math.floor(idx / PER_PAGE) + 1;
}
 
/* -------- build one question card -------- */
function buildQuestion(q) {
  const card = document.createElement("div");
  card.className = "q";
  card.dataset.qid = q.id;
  card.setAttribute("role", "radiogroup");
  card.setAttribute("aria-labelledby", "lbl-" + q.id);
 
  const text = document.createElement("p");
  text.className = "qtext";
  text.id = "lbl-" + q.id;
  text.textContent = q.text;
  card.appendChild(text);
 
  const scale = document.createElement("div");
  scale.className = "scale";
 
  LIKERT.forEach((label, i) => {
	const value = i + 1;
 
	const opt = document.createElement("label");
	opt.className = "opt";
	opt.title = label;
 
	const input = document.createElement("input");
	input.type = "radio";
	input.name = q.id;
	input.value = String(value);
    input.setAttribute("aria-label", q.text + " — " + label);
 
	const num = document.createElement("span");
	num.className = "num";
	num.textContent = String(value);
 
    opt.appendChild(input);
    opt.appendChild(num);
    scale.appendChild(opt);
  });
 
  card.appendChild(scale);
  return card;
}
 
/* -------- build one page -------- */
function buildPage(p) {
  const sec = document.createElement("section");
  sec.className = "page";
  sec.dataset.page = p;
  if (p !== 1) sec.hidden = true;
 
  /* name field — page 1 only */
  if (p === 1) {
	const nb = document.createElement("div");
	nb.className = "nameblock";
 
	const lbl = document.createElement("label");
    lbl.setAttribute("for", "respondentName");
	lbl.textContent = "Your name";
 
	const inp = document.createElement("input");
	inp.type = "text";
	inp.id = "respondentName";
	inp.name = "respondentName";
	inp.placeholder = "Enter your full name";
	inp.autocomplete = "name";
 
    nb.appendChild(lbl);
    nb.appendChild(inp);
    sec.appendChild(nb);
  }
 
  /* scale legend */
  const legend = document.createElement("div");
  legend.className = "legend";
  legend.textContent = "1 = Strongly disagree  •  4 = Neutral  •  7 = Strongly agree";
  sec.appendChild(legend);
 
  /* questions */
  pageQuestions(p).forEach(q => sec.appendChild(buildQuestion(q)));
 
  return sec;
}
 
/* -------- render all pages -------- */
function render() {
  for (let p = 1; p <= TOTAL_PAGES; p++) {
    form.appendChild(buildPage(p));
  }
  updateUI();
}
 
/* -------- UI state -------- */
function updateUI() {
  pageLabel.textContent = "Page " + page + " of " + TOTAL_PAGES;
 
  const pct = Math.round((page / TOTAL_PAGES) * 100);
  bar.style.width = pct + "%";
  pctLabel.textContent = pct + "%";
 
  prevBtn.hidden   = page === 1;
  nextBtn.hidden   = page === TOTAL_PAGES;
  submitBtn.hidden = page !== TOTAL_PAGES;
}
 
/* -------- navigation -------- */
function showPage(target) {
  form.querySelector('.page[data-page="' + page + '"]').hidden = true;
  page = target;
  form.querySelector('.page[data-page="' + page + '"]').hidden = false;
  window.scrollTo({ top: 0, behavior: "smooth" });
  updateUI();
}
 
/* -------- validation -------- */
function validatePage(p) {
  const problems = [];
 
  if (p === 1) {
	const n = document.getElementById("respondentName");
	if (!n.value.trim()) problems.push(n);
  }
 
  pageQuestions(p).forEach(q => {
	if (!form.querySelector('input[name="' + q.id + '"]:checked')) {
      problems.push(form.querySelector('.q[data-qid="' + q.id + '"]'));
	}
  });
 
  return problems;
}
 
function validateAll() {
  const problems = [];
 
  const n = document.getElementById("respondentName");
  if (!n.value.trim()) problems.push(n);
 
  QUESTIONS.forEach(q => {
	if (!form.querySelector('input[name="' + q.id + '"]:checked')) {
      problems.push(form.querySelector('.q[data-qid="' + q.id + '"]'));
	}
  });
 
  return problems;
}
 
function flagProblems(problems) {
  problems.forEach(el => {
	if (el && el.classList.contains("q")) el.classList.add("missing");
	else if (el) el.classList.add("missing-input");
  });
 
  if (problems.length) {
	const first = problems[0];
    first.scrollIntoView({ behavior: "smooth", block: "center" });
    setAlert("Please answer all items on this page.");
  }
}
 
function setAlert(msg) {
  alertBox.textContent = msg || "";
}
function clearAlert() {
  alertBox.textContent = "";
}
 
/* -------- payload -------- */
function buildPayload() {
  const data = new URLSearchParams();
 
  data.append(CONFIG.nameEntry, document.getElementById("respondentName").value.trim());
 
  QUESTIONS.forEach(q => {
	const checked = form.querySelector('input[name="' + q.id + '"]:checked');
    data.append(q.entry, checked ? checked.value : "");
  });
 
  return data;
}
 
/* -------- send to Google Forms -------- */
async function sendToGoogleForms() {
  const body = buildPayload();
 
  await fetch(CONFIG.formAction, {
	method: "POST",
	mode: "no-cors",                       // Google Forms blocks CORS reads; this still delivers
	headers: { "Content-Type": "application/x-www-form-urlencoded" },
	body: body.toString()
  });
}
 
/* -------- events -------- */
form.addEventListener("change", e => {
  const card = e.target.closest(".q");
  if (card) card.classList.remove("missing");
  clearAlert();
});
 
form.addEventListener("input", e => {
  if (e.target.id === "respondentName") {
    e.target.classList.remove("missing-input");
	clearAlert();
  }
});
 
nextBtn.addEventListener("click", () => {
  const problems = validatePage(page);
  if (problems.length) {
    flagProblems(problems);
	return;
  }
  clearAlert();
  showPage(page + 1);
});
 
prevBtn.addEventListener("click", () => {
  clearAlert();
  showPage(page - 1);
});
 
submitBtn.addEventListener("click", async () => {
  const problems = validateAll();
 
  if (problems.length) {
	const first = problems[0];
	const targetPage = first.classList.contains("q")
  	? pageOfQid(first.dataset.qid)
  	: 1;
 
    flagProblems(problems);
	if (targetPage !== page) showPage(targetPage);
	return;
  }
 
  clearAlert();
  submitBtn.disabled = true;
  submitBtn.textContent = "Submitting…";
 
  try {
	await sendToGoogleForms();
	form.hidden = true;
	bottomBar.hidden = true;
	doneScreen.hidden = false;
	window.scrollTo({ top: 0, behavior: "smooth" });
  } catch (err) {
    console.error(err);
	submitBtn.disabled = false;
    submitBtn.textContent = "Submit";
    setAlert("Submission failed. Please check your connection and try again.");
  }
});
 
/* -------- go -------- */
render();
</script>
 
</body>
</html>
