<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Survey</title>
<style>
  *{box-sizing:border-box}
  :root{
	--bg:#f4f6fb;
	--card:#ffffff;
	--ink:#1f2430;
	--muted:#6b7280;
	--line:#e3e7ef;
	--accent:#3b5bfd;
    --accent-soft:#eef1ff;
	--danger:#d64545;
  }
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
	color:var(--ink);
	font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
	padding:24px 16px 140px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:860px;margin:0 auto}
 
  /* ---------- header ---------- */
  .top{margin-bottom:20px}
  .top h1{font-size:24px;margin:0 0 4px}
  .top .sub{margin:0 0 14px;color:var(--muted);font-size:14px}
  .progress{height:8px;background:#e6e9f2;border-radius:99px;overflow:hidden}
  .progress .bar{height:100%;width:20%;background:var(--accent);border-radius:99px;transition:width .25s ease}
  .pagemeta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:6px;font-weight:600}
 
  /* ---------- name block ---------- */
  .nameblock{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:16px;margin-bottom:14px;
  }
  .nameblock label{display:block;font-weight:600;margin-bottom:8px}
  .nameblock input{
    width:100%;padding:11px 12px;font-size:16px;font-family:inherit;
	border:1px solid var(--line);border-radius:10px;outline:none;background:#fbfcff;color:var(--ink);
  }
  .nameblock input:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px var(--accent-soft)}
  .nameblock input.missing-input{border-color:var(--danger);background:#fff5f5}
 
  /* ---------- question card ---------- */
  .q{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:16px;margin:0 0 12px;
  }
  .q.missing{border-color:var(--danger);box-shadow:0 0 0 3px #fdecec}
  .qtext{margin:0 0 12px;font-weight:600;font-size:15.5px}
 
  .scale{display:flex;gap:8px}
  .opt{
    position:relative;flex:1 1 0;min-width:0;
    display:flex;align-items:center;justify-content:center;
	padding:11px 0;border:1px solid var(--line);border-radius:10px;
    background:#fbfcff;cursor:pointer;user-select:none;
    transition:background .15s,border-color .15s,color .15s;
  }
  .opt input{position:absolute;opacity:0;width:0;height:0;margin:0}
  .opt .num{font-weight:700;font-size:15px;color:var(--muted)}
  .opt:hover{border-color:var(--accent);background:var(--accent-soft)}
  .opt:has(input:checked){background:var(--accent);border-color:var(--accent)}
  .opt:has(input:checked) .num{color:#fff}
  .opt input:focus-visible + .num{outline:2px solid var(--accent);outline-offset:6px;border-radius:4px}
 
  .legend{
    font-size:12.5px;color:var(--muted);margin:0 0 12px;
    background:#eef1ff;border:1px solid #dde3ff;border-radius:10px;
	padding:8px 12px;text-align:center;font-weight:600;
  }
 
  /* ---------- bottom bar ---------- */
  .bottom{
    position:fixed;left:0;right:0;bottom:0;z-index:20;
    background:rgba(255,255,255,.95);
    backdrop-filter:blur(8px);
	border-top:1px solid var(--line);
  }
  .bottom .inner{
    max-width:860px;margin:0 auto;padding:10px 16px;
    display:flex;align-items:center;gap:12px;
  }
  .alert{color:var(--danger);font-size:13.5px;font-weight:700}
  .btns{display:flex;gap:10px;margin-left:auto}
  .btn{
    font:inherit;font-weight:600;font-size:15px;
	padding:11px 22px;border-radius:10px;border:1px solid var(--accent);
    background:var(--accent);color:#fff;cursor:pointer;transition:opacity .15s,background .15s;
  }
  .btn:hover{opacity:.9}
  .btn.ghost{background:#fff;color:var(--accent)}
  .btn.ghost:hover{background:var(--accent-soft);opacity:1}
  .btn[disabled]{opacity:.55;cursor:not-allowed}
  .btn[hidden]{display:none}
 
  /* ---------- done screen ---------- */
  .done{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
	padding:48px 24px;text-align:center;
  }
  .done h2{margin:0 0 8px;font-size:22px}
  .done p{margin:0;color:var(--muted)}
 
  @media (max-width:520px){
	.q{padding:14px}
	.scale{gap:5px}
	.opt{padding:10px 0;border-radius:8px}
	.opt .num{font-size:14px}
	.btn{padding:10px 16px;font-size:14px}
  }
</style>
</head>
<body>
 
<div class="wrap">
  <header class="top">
    <h1>Survey</h1>
	<p class="sub">Please answer every statement on each page.</p>
	<div class="progress"><div class="bar" id="bar"></div></div>
	<div class="pagemeta">
  	<span id="pageLabel">Page 1 of 5</span>
  	<span id="pct">20%</span>
	</div>
  </header>
 
  <form id="survey" novalidate></form>
 
  <div id="done" class="done" hidden>
	<h2>Thank you!</h2>
	<p>Your responses have been submitted.</p>
  </div>
</div>
 
<div class="bottom" id="bottomBar">
  <div class="inner">
	<span class="alert" id="alert" role="alert" aria-live="polite"></span>
	<div class="btns">
  	<button type="button" class="btn ghost" id="prevBtn" hidden>Back</button>
  	<button type="button" class="btn" id="nextBtn">Next</button>
  	<button type="button" class="btn" id="submitBtn" hidden>Submit</button>
	</div>
  </div>
</div>
 
<script>
/* ============================================================
   1) CONFIGURATION — Google Form target
   ============================================================
   formAction : your form's POST endpoint
                https://docs.google.com/forms/d/e/<FORM_ID>/formResponse
   nameEntry  : the entry ID for the "Name" short-answer question
   ============================================================ */
const CONFIG = {
  formAction: "https://docs.google.com/forms/d/e/PASTE_YOUR_FORM_ID_HERE/formResponse",
  nameEntry:  "entry.1000000"   // <-- Name question entry ID
};
 
/* ============================================================
   2) QUESTIONS + GOOGLE FORM ENTRY IDs
   ------------------------------------------------------------
   Replace each "entry.1000xxx" with the real entry ID from
   your Google Form (Get pre-filled link -> inspect the URL).
   Every line = one question, its text and its entry ID.
   ============================================================ */
const QUESTIONS = [
  /* ---------- PAGE 1 : Q1 – Q20 ---------- */
 { id: "1", text: "I try to be with people.", entry: "entry.576977468" },
{ id: "2", text: "I let other people decide what to do.", entry: "entry.1697730550" },
{ id: "3", text: "I join social groups.", entry: "entry.1870422053" },
{ id: "4", text: "I try to have close relationships with people.", entry: "entry.1134204447" },
{ id: "5", text: "I tend to join social organizations when I have an opportunity.", entry: "entry.1832986267" },
{ id: "6", text: "I let other people strongly influence my actions.", entry: "entry.152674328" },
{ id: "7", text: "I try to be included in informal social activities.", entry: "entry.581727770" },
{ id: "8", text: "I try to have close, personal relationships with people.", entry: "entry.1507297685" },
{ id: "9", text: "I try to include other people in my plans.", entry: "entry.103079710" },
{ id: "10", text: "I let other people control my actions.", entry: "entry.577561468" },
{ id: "11", text: "I try to have people around me.", entry: "entry.228837376" },
{ id: "12", text: "I try to get close and personal with people.", entry: "entry.346016615" },
{ id: "13", text: "When people are doing things together I tend to join them.", entry: "entry.1676539875" },
{ id: "14", text: "I am easily led by people.", entry: "entry.1462476133" },
{ id: "15", text: "I try to avoid being alone.", entry: "entry.1194385902" },
{ id: "16", text: "I try to participate in group activities.", entry: "entry.1347541308" },
{ id: "17", text: "I try to be friendly to people.", entry: "entry.251744165" },
{ id: "18", text: "I let other people decide what to do.", entry: "entry.207443007" },
{ id: "19", text: "My personal relations with people are cool and distant.", entry: "entry.534046158" },
{ id: "20", text: "I let other people take charge of things.", entry: "entry.960123534" },
 
  /* ---------- PAGE 2 : Q21 – Q40 ---------- */
{ id: "21", text: "I try to have close relationships with people.", entry: "entry.1402299228" },
{ id: "22", text: "I let other people strongly influence my actions.", entry: "entry.1763651356" },
{ id: "23", text: "I try to get close and personal with people.", entry: "entry.1104080981" },
{ id: "24", text: "I let other people control my actions.", entry: "entry.245836839" },
{ id: "25", text: "I act cool and distant with people.", entry: "entry.1290541058" },
{ id: "26", text: "I am easily led by people.", entry: "entry.291718627" },
{ id: "27", text: "I try to have close, personal relationships with people.", entry: "entry.1381047399" },
{ id: "28", text: "I like people to invite me to things.", entry: "entry.1029189984" },
{ id: "29", text: "I like people to act close and personal with me.", entry: "entry.1735058256" },
{ id: "30", text: "I try to influence strongly other people's actions.", entry: "entry.1381827617" },
{ id: "31", text: "I like people to invite me to join in their activities.", entry: "entry.1083641038" },
{ id: "32", text: "I like people to act close toward me.", entry: "entry.2008763756" },
{ id: "33", text: "I try to take charge of things when I'm with people.", entry: "entry.1382840189" },
{ id: "34", text: "I like people to include me in their activities.", entry: "entry.312209818" },
{ id: "35", text: "I like people to act cool and distant toward me.", entry: "entry.847538831" },
{ id: "36", text: "I try to have other people do things the way I want them done.", entry: "entry.1008388513" },
{ id: "37", text: "I like people to ask me to participate in their discussions.", entry: "entry.1403307594" },
{ id: "38", text: "I like people to act friendly toward me.", entry: "entry.1063962727" },
{ id: "39", text: "I like people to invite me to participate in their activities.", entry: "entry.946900452" },
{ id: "40", text: "I like people to act distant toward me.", entry: "entry.765468421" },
 
  /* ---------- PAGE 3 : Q41 – Q53 ---------- */
 { id: "41", text: "I try to be the dominant person when I am with people.", entry: "entry.1843224162" },
{ id: "42", text: "I like people to invite me to things.", entry: "entry.500123340" },
{ id: "43", text: "I like people to act close toward me.", entry: "entry.1666179004" },
{ id: "44", text: "I try to have other people do things I want done.", entry: "entry.35972014" },
{ id: "45", text: "I like people to invite me to join their activities.", entry: "entry.1494652842" },
{ id: "46", text: "I like people to act cool and distant toward me.", entry: "entry.61228748" },
{ id: "47", text: "I try to influence strongly other people's actions.", entry: "entry.301453163" },
{ id: "48", text: "I like people to include me in their activities.", entry: "entry.1986387614" },
{ id: "49", text: "I like people to act close and personal with me.", entry: "entry.670044050" },
{ id: "50", text: "I try to take charge of things when I'm with people.", entry: "entry.1349724827" },
{ id: "51", text: "I like people to invite me to participate in their activities.", entry: "entry.1638111038" },
{ id: "52", text: "I like people to act distant toward me.", entry: "entry.774450944" },
{ id: "53", text: "I try to have other people do things the way I want them done.", entry: "entry.1389573683" },
{ id: "54", text: "I take charge of things when I’m with people. ", entry: "entry.1315319772" }
];
 
/* ============================================================
   3) LIKERT SCALE
   ============================================================ */
const LIKERT = [
  "Usually",   // 1
  "Often",            // 2
  "Sometimes",   // 3
  "Occasionally",             // 4
  "Rarely",  	// 5
  "Never",               // 6
];
 
/* ============================================================
   4) APP
   ============================================================ */
const PER_PAGE = 20;
const TOTAL_PAGES = Math.ceil(QUESTIONS.length / PER_PAGE);
 
const form   	= document.getElementById("survey");
const bar    	= document.getElementById("bar");
const pageLabel  = document.getElementById("pageLabel");
const pctLabel   = document.getElementById("pct");
const prevBtn	= document.getElementById("prevBtn");
const nextBtn	= document.getElementById("nextBtn");
const submitBtn  = document.getElementById("submitBtn");
const alertBox   = document.getElementById("alert");
const bottomBar  = document.getElementById("bottomBar");
const doneScreen = document.getElementById("done");
 
let page = 1;
 
/* -------- helpers -------- */
function pageQuestions(p) {
  return QUESTIONS.slice((p - 1) * PER_PAGE, p * PER_PAGE);
}
 
function pageOfQid(qid) {
  const idx = QUESTIONS.findIndex(q => q.id === qid);
  return idx < 0 ? 1 : Math.floor(idx / PER_PAGE) + 1;
}
 
/* -------- build one question card -------- */
function buildQuestion(q) {
  const card = document.createElement("div");
  card.className = "q";
  card.dataset.qid = q.id;
  card.setAttribute("role", "radiogroup");
  card.setAttribute("aria-labelledby", "lbl-" + q.id);
 
  const text = document.createElement("p");
  text.className = "qtext";
  text.id = "lbl-" + q.id;
  text.textContent = q.text;
  card.appendChild(text);
 
  const scale = document.createElement("div");
  scale.className = "scale";
 
  LIKERT.forEach((label, i) => {
	const value = i + 1;
 
	const opt = document.createElement("label");
	opt.className = "opt";
	opt.title = label;
 
	const input = document.createElement("input");
	input.type = "radio";
	input.name = q.id;
	input.value = String(value);
    input.setAttribute("aria-label", q.text + " — " + label);
 
	const num = document.createElement("span");
	num.className = "num";
	num.textContent = String(value);
 
    opt.appendChild(input);
    opt.appendChild(num);
    scale.appendChild(opt);
  });
 
  card.appendChild(scale);
  return card;
}
 
/* -------- build one page -------- */
function buildPage(p) {
  const sec = document.createElement("section");
  sec.className = "page";
  sec.dataset.page = p;
  if (p !== 1) sec.hidden = true;
 
  /* name field — page 1 only */
  if (p === 1) {
	const nb = document.createElement("div");
	nb.className = "nameblock";
 
	const lbl = document.createElement("label");
    lbl.setAttribute("for", "respondentName");
	lbl.textContent = "Your name";
 
	const inp = document.createElement("input");
	inp.type = "text";
	inp.id = "respondentName";
	inp.name = "respondentName";
	inp.placeholder = "Enter your full name";
	inp.autocomplete = "name";
 
    nb.appendChild(lbl);
    nb.appendChild(inp);
    sec.appendChild(nb);
  }
 
  /* scale legend */
  const legend = document.createElement("div");
  legend.className = "legend";
  legend.textContent = "1 = Strongly disagree  •  4 = Neutral  •  7 = Strongly agree";
  sec.appendChild(legend);
 
  /* questions */
  pageQuestions(p).forEach(q => sec.appendChild(buildQuestion(q)));
 
  return sec;
}
 
/* -------- render all pages -------- */
function render() {
  for (let p = 1; p <= TOTAL_PAGES; p++) {
    form.appendChild(buildPage(p));
  }
  updateUI();
}
 
/* -------- UI state -------- */
function updateUI() {
  pageLabel.textContent = "Page " + page + " of " + TOTAL_PAGES;
 
  const pct = Math.round((page / TOTAL_PAGES) * 100);
  bar.style.width = pct + "%";
  pctLabel.textContent = pct + "%";
 
  prevBtn.hidden   = page === 1;
  nextBtn.hidden   = page === TOTAL_PAGES;
  submitBtn.hidden = page !== TOTAL_PAGES;
}
 
/* -------- navigation -------- */
function showPage(target) {
  form.querySelector('.page[data-page="' + page + '"]').hidden = true;
  page = target;
  form.querySelector('.page[data-page="' + page + '"]').hidden = false;
  window.scrollTo({ top: 0, behavior: "smooth" });
  updateUI();
}
 
/* -------- validation -------- */
function validatePage(p) {
  const problems = [];
 
  if (p === 1) {
	const n = document.getElementById("respondentName");
	if (!n.value.trim()) problems.push(n);
  }
 
  pageQuestions(p).forEach(q => {
	if (!form.querySelector('input[name="' + q.id + '"]:checked')) {
      problems.push(form.querySelector('.q[data-qid="' + q.id + '"]'));
	}
  });
 
  return problems;
}
 
function validateAll() {
  const problems = [];
 
  const n = document.getElementById("respondentName");
  if (!n.value.trim()) problems.push(n);
 
  QUESTIONS.forEach(q => {
	if (!form.querySelector('input[name="' + q.id + '"]:checked')) {
      problems.push(form.querySelector('.q[data-qid="' + q.id + '"]'));
	}
  });
 
  return problems;
}
 
function flagProblems(problems) {
  problems.forEach(el => {
	if (el && el.classList.contains("q")) el.classList.add("missing");
	else if (el) el.classList.add("missing-input");
  });
 
  if (problems.length) {
	const first = problems[0];
    first.scrollIntoView({ behavior: "smooth", block: "center" });
    setAlert("Please answer all items on this page.");
  }
}
 
function setAlert(msg) {
  alertBox.textContent = msg || "";
}
function clearAlert() {
  alertBox.textContent = "";
}
 
/* -------- payload -------- */
function buildPayload() {
  const data = new URLSearchParams();
 
  data.append(CONFIG.nameEntry, document.getElementById("respondentName").value.trim());
 
  QUESTIONS.forEach(q => {
	const checked = form.querySelector('input[name="' + q.id + '"]:checked');
    data.append(q.entry, checked ? checked.value : "");
  });
 
  return data;
}
 
/* -------- send to Google Forms -------- */
async function sendToGoogleForms() {
  const body = buildPayload();
 
  await fetch(CONFIG.formAction, {
	method: "POST",
	mode: "no-cors",                       // Google Forms blocks CORS reads; this still delivers
	headers: { "Content-Type": "application/x-www-form-urlencoded" },
	body: body.toString()
  });
}
 
/* -------- events -------- */
form.addEventListener("change", e => {
  const card = e.target.closest(".q");
  if (card) card.classList.remove("missing");
  clearAlert();
});
 
form.addEventListener("input", e => {
  if (e.target.id === "respondentName") {
    e.target.classList.remove("missing-input");
	clearAlert();
  }
});
 
nextBtn.addEventListener("click", () => {
  const problems = validatePage(page);
  if (problems.length) {
    flagProblems(problems);
	return;
  }
  clearAlert();
  showPage(page + 1);
});
 
prevBtn.addEventListener("click", () => {
  clearAlert();
  showPage(page - 1);
});
 
submitBtn.addEventListener("click", async () => {
  const problems = validateAll();
 
  if (problems.length) {
	const first = problems[0];
	const targetPage = first.classList.contains("q")
  	? pageOfQid(first.dataset.qid)
  	: 1;
 
    flagProblems(problems);
	if (targetPage !== page) showPage(targetPage);
	return;
  }
 
  clearAlert();
  submitBtn.disabled = true;
  submitBtn.textContent = "Submitting…";
 
  try {
	await sendToGoogleForms();
	form.hidden = true;
	bottomBar.hidden = true;
	doneScreen.hidden = false;
	window.scrollTo({ top: 0, behavior: "smooth" });
  } catch (err) {
    console.error(err);
	submitBtn.disabled = false;
    submitBtn.textContent = "Submit";
    setAlert("Submission failed. Please check your connection and try again.");
  }
});
 
/* -------- go -------- */
render();
</script>
 
</body>
</html>
