<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Survey</title>
<style>
  *{box-sizing:border-box}
  :root{
    --bg:#f4f6fb; --card:#ffffff; --ink:#1f2430; --muted:#6b7280;
    --line:#e3e7ef; --accent:#3b5bfd; --accent-soft:#eef1ff; --danger:#d64545;
  }
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding:24px 16px 140px; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:860px;margin:0 auto}
  .top{margin-bottom:20px}
  .top h1{font-size:24px;margin:0 0 4px}
  .top .sub{margin:0 0 14px;color:var(--muted);font-size:14px}
  .progress{height:8px;background:#e6e9f2;border-radius:99px;overflow:hidden}
  .progress .bar{height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .25s ease}
  .pagemeta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:6px;font-weight:600}
  .nameblock{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
  .nameblock label{display:block;font-weight:600;margin-bottom:8px}
  .nameblock input{width:100%;padding:11px 12px;font-size:16px;font-family:inherit;border:1px solid var(--line);border-radius:10px;outline:none;background:#fbfcff;color:var(--ink)}
  .nameblock input:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px var(--accent-soft)}
  .nameblock input.missing-input{border-color:var(--danger);background:#fff5f5}
  .q{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 12px}
  .q.missing{border-color:var(--danger);box-shadow:0 0 0 3px #fdecec}
  .qtext{margin:0 0 12px;font-weight:600;font-size:15.5px}
  .scale{display:flex;gap:8px}
  .opt{position:relative;flex:1 1 0;min-width:0;display:flex;align-items:center;justify-content:center;padding:11px 0;border:1px solid var(--line);border-radius:10px;background:#fbfcff;cursor:pointer;user-select:none;transition:background .15s,border-color .15s,color .15s}
  .opt input{position:absolute;opacity:0;width:0;height:0;margin:0}
  .opt .num{font-weight:700;font-size:15px;color:var(--muted)}
  .opt:hover{border-color:var(--accent);background:var(--accent-soft)}
  .opt:has(input:checked){background:var(--accent);border-color:var(--accent)}
  .opt:has(input:checked) .num{color:#fff}
  .opt input:focus-visible + .num{outline:2px solid var(--accent);outline-offset:6px;border-radius:4px}
  .legend{font-size:12.5px;color:var(--muted);margin:0 0 12px;background:#eef1ff;border:1px solid #dde3ff;border-radius:10px;padding:8px 12px;text-align:center;font-weight:600}
  .bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);border-top:1px solid var(--line)}
  .bottom .inner{max-width:860px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
  .alert{color:var(--danger);font-size:13.5px;font-weight:700}
  .btns{display:flex;gap:10px;margin-left:auto}
  .btn{font:inherit;font-weight:600;font-size:15px;padding:11px 22px;border-radius:10px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;transition:opacity .15s,background .15s}
  .btn:hover{opacity:.9}
  .btn.ghost{background:#fff;color:var(--accent)}
  .btn.ghost:hover{background:var(--accent-soft);opacity:1}
  .btn[disabled]{opacity:.55;cursor:not-allowed}
  .btn[hidden]{display:none}
  .done{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:48px 24px;text-align:center}
  .done h2{margin:0 0 8px;font-size:22px}
  .done p{margin:0;color:var(--muted)}
  @media (max-width:520px){
    .q{padding:14px}
    .scale{gap:5px}
    .opt{padding:10px 0;border-radius:8px}
    .opt .num{font-size:14px}
    .btn{padding:10px 16px;font-size:14px}
  }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <h1>Survey</h1>
    <p class="sub">Please answer every statement on each page.</p>
    <div class="progress"><div class="bar" id="bar"></div></div>
    <div class="pagemeta">
      <span id="pageLabel">Page 1</span>
      <span id="pct"></span>
    </div>
  </header>

  <form id="survey" novalidate></form>

  <div id="done" class="done" hidden>
    <h2>Thank you!</h2>
    <p>Your responses have been submitted.</p>
  </div>
</div>

<div class="bottom" id="bottomBar">
  <div class="inner">
    <span class="alert" id="alert" role="alert" aria-live="polite"></span>
    <div class="btns">
      <button type="button" class="btn ghost" id="prevBtn" hidden>Back</button>
      <button type="button" class="btn" id="nextBtn">Next</button>
      <button type="button" class="btn" id="submitBtn" hidden>Submit</button>
    </div>
  </div>
</div>

<script>
/* ============================================================
   1) CONFIGURATION — Google Form target
   ============================================================ */
const CONFIG = {
  formAction: "https://docs.google.com/forms/d/e/PASTE_YOUR_FORM_ID_HERE/formResponse",
  nameEntry:  "entry.1000000"
};

/* ============================================================
   2) QUESTIONS + GOOGLE FORM ENTRY IDs
   ============================================================ */
const QUESTIONS = [
  /* ---------- PAGE 1 : Q1 – Q20 ---------- */
  { id: "1",  text: "If asked to list my top three strengths, I would have hard time listing them.", entry: "entry.1442792584" },
  { id: "2",  text: "I find myself feeling nervous about situations or events, and I don't even know why.", entry: "entry.1666029750" },
  { id: "3",  text: "I adjust my behavior depending on who I am interacting with (e.g. calm and friendly with a child, serious and professional with my boss, etc.).", entry: "entry.1803454888" },
  { id: "4",  text: "Once a pessimistic thought pops into my head, it's like a floodgate opened - my thoughts get more and more negative.", entry: "entry.1608058289" },
  { id: "5",  text: "Even when I don't want to, I consistently put other people's needs ahead of my own.", entry: "entry.305702049" },
  { id: "6",  text: "I spend hours wondering what people meant by offhand (not well considered) remarks.", entry: "entry.141344783" },
  { id: "7",  text: "I have certain compulsive habits that I just can't seem to stop (e.g. overeating, smoking, complaining etc.).", entry: "entry.49596397" },
  { id: "8",  text: "When something is bothering me, I cannot stop thinking about it.", entry: "entry.1521154758" },
  { id: "9",  text: "I like learning new things.", entry: "entry.117660150" },
  { id: "10", text: "When I need to do something difficult or unpleasant, I find it hard to motivate myself to get started.", entry: "entry.662459254" },
  { id: "11", text: "If a person I'm speaking to seems ill-at-ease or intimidated, I will attempt to make him/her more comfortable (e.g. take a different posture, make my tone lighter, laugh, etc.).", entry: "entry.325311438" },
  { id: "12", text: "I avoid fights, expressing my opinion, or doing what I want for fear that I will upset others or lose their love/friendship.", entry: "entry.567036304" },
  { id: "13", text: "I know exactly where I want to be 5 years from now.", entry: "entry.1167902574" },
  { id: "14", text: "I know which situations I can handle, and which ones will take me out of my emotional comfort-zone.", entry: "entry.1595319820" },
  { id: "15", text: "I am stubborn.", entry: "entry.2052557793" },
  { id: "16", text: "When I'm feeling down, I remind myself to focus on the good things, no matter how small it is.", entry: "entry.1674692065" },
  { id: "17", text: "When someone around me becomes emotional, I tend to move away from the situation.", entry: "entry.190026524" },
  { id: "18", text: "I often find it difficult to stand up for my rights.", entry: "entry.514268942" },
  { id: "19", text: "I find it easy to find out when I am feeling negative emotions, like anger or sadness; I try to ignore them as much as possible.", entry: "entry.284277860" },
  { id: "20", text: "I express my opinion even if there's a good chance that other people will disagree with me.", entry: "entry.1696025205" },

  /* ---------- PAGE 2 : Q21 – Q36 ---------- */
  { id: "21", text: "If the situation calls for it, I can be civil to a person whom I really dislike (e.g. at a get-together of a mutual friend or a business meeting).", entry: "entry.448507254" },
  { id: "22", text: "When I mess up, I say self-deprecating things, such as \"I am such a loser\", \"Stupid, stupid, stupid\", or \"I can't do anything right\".", entry: "entry.1735626070" },
  { id: "23", text: "People tend to confide their emotions in me.", entry: "entry.1643546829" },
  { id: "24", text: "I would describe myself as a good negotiator.", entry: "entry.1865249650" },
  { id: "25", text: "I engage in activities that allow me to get in touch with my emotions (e.g. writing a diary, meditating, etc.).", entry: "entry.886192709" },
  { id: "26", text: "I am surprised by my emotional reactions to situations I encounter in my life.", entry: "entry.1943177370" },
  { id: "27", text: "I change my attitude, behavior, or appearance in order to please others.", entry: "entry.375902777" },
  { id: "28", text: "I tend to over-analyze situations, finding problems that don't really exist.", entry: "entry.1165876230" },
  { id: "29", text: "Even when I take tough actions, I feel genuinely concerned about the consequences it can have on other people.", entry: "entry.1637802404" },
  { id: "30", text: "I tend to back out even when I am right.", entry: "entry.1328375628" },
  { id: "31", text: "I can certainly predict the way I am likely to behave when I feel jealous.", entry: "entry.337282583" },
  { id: "32", text: "I feel more comfortable when someone else makes my decisions for me.", entry: "entry.1886234370" },
  { id: "33", text: "If the situation calls for it, I can appear to be having a good time even if I am not enjoying myself.", entry: "entry.2084602152" },
  { id: "34", text: "I tend to assume the worst of people.", entry: "entry.1483672375" },
  { id: "35", text: "I find it easy to walk over and offer my support even when others feel it embarrassing to do so.", entry: "entry.1053889743" },
  { id: "36", text: "I don't seem to have any power at all over other people's feelings.", entry: "entry.1767611630" }
];

/* ============================================================
   3) LIKERT SCALE
   ============================================================ */
const LIKERT = [
  "Completely agree",     // 1
  "Agree",                // 2
  "Somewhat agree",       // 3
  "Neutral",              // 4
  "Somewhat disagree",    // 5
  "Disagree",             // 6
  "Completely disagree"   // 7
];

/* ============================================================
   4) APP
   ============================================================ */
const PER_PAGE = 20;
const TOTAL_PAGES = Math.ceil(QUESTIONS.length / PER_PAGE);

const form       = document.getElementById("survey");
const bar        = document.getElementById("bar");
const pageLabel  = document.getElementById("pageLabel");
const pctLabel   = document.getElementById("pct");
const prevBtn    = document.getElementById("prevBtn");
const nextBtn    = document.getElementById("nextBtn");
const submitBtn  = document.getElementById("submitBtn");
const alertBox   = document.getElementById("alert");
const bottomBar  = document.getElementById("bottomBar");
const doneScreen = document.getElementById("done");

let page = 1;

function pageQuestions(p) {
  return QUESTIONS.slice((p - 1) * PER_PAGE, p * PER_PAGE);
}

function pageOfQid(qid) {
  const idx = QUESTIONS.findIndex(q => q.id === qid);
  return idx < 0 ? 1 : Math.floor(idx / PER_PAGE) + 1;
}

function buildQuestion(q) {
  const card = document.createElement("div");
  card.className = "q";
  card.dataset.qid = q.id;
  card.setAttribute("role", "radiogroup");
  card.setAttribute("aria-labelledby", "lbl-" + q.id);

  const text = document.createElement("p");
  text.className = "qtext";
  text.id = "lbl-" + q.id;
  text.textContent = q.text;
  card.appendChild(text);

  const scale = document.createElement("div");
  scale.className = "scale";

  LIKERT.forEach((label, i) => {
    const value = i + 1;

    const opt = document.createElement("label");
    opt.className = "opt";
    opt.title = label;

    const input = document.createElement("input");
    input.type = "radio";
    input.name = q.id;
    input.value = String(value);
    input.setAttribute("aria-label", q.text + " — " + label);

    const num = document.createElement("span");
    num.className = "num";
    num.textContent = String(value);

    opt.appendChild(input);
    opt.appendChild(num);
    scale.appendChild(opt);
  });

  card.appendChild(scale);
  return card;
}

function buildPage(p) {
  const sec = document.createElement("section");
  sec.className = "page";
  sec.dataset.page = p;
  if (p !== 1) sec.hidden = true;

  if (p === 1) {
    const nb = document.createElement("div");
    nb.className = "nameblock";

    const lbl = document.createElement("label");
    lbl.setAttribute("for", "respondentName");
    lbl.textContent = "Your name";

    const inp = document.createElement("input");
    inp.type = "text";
    inp.id = "respondentName";
    inp.name = "respondentName";
    inp.placeholder = "Enter your full name";
    inp.autocomplete = "name";

    nb.appendChild(lbl);
    nb.appendChild(inp);
    sec.appendChild(nb);
  }

  const legend = document.createElement("div");
  legend.className = "legend";
  legend.textContent = "1 = Completely agree  •  4 = Neutral  •  7 = Completely disagree";
  sec.appendChild(legend);

  pageQuestions(p).forEach(q => sec.appendChild(buildQuestion(q)));
  return sec;
}

function render() {
  for (let p = 1; p <= TOTAL_PAGES; p++) {
    form.appendChild(buildPage(p));
  }
  updateUI();
}

function updateUI() {
  pageLabel.textContent = "Page " + page + " of " + TOTAL_PAGES;
  const pct = Math.round((page / TOTAL_PAGES) * 100);
  bar.style.width = pct + "%";
  pctLabel.textContent = pct + "%";

  prevBtn.hidden   = page === 1;
  nextBtn.hidden   = page === TOTAL_PAGES;
  submitBtn.hidden = page !== TOTAL_PAGES;
}

function showPage(target) {
  form.querySelector('.page[data-page="' + page + '"]').hidden = true;
  page = target;
  form.querySelector('.page[data-page="' + page + '"]').hidden = false;
  window.scrollTo({ top: 0, behavior: "smooth" });
  updateUI();
}

function validatePage(p) {
  const problems = [];
  if (p === 1) {
    const n = document.getElementById("respondentName");
    if (!n.value.trim()) problems.push(n);
  }
  pageQuestions(p).forEach(q => {
    if (!form.querySelector('input[name="' + q.id + '"]:checked')) {
      problems.push(form.querySelector('.q[data-qid="' + q.id + '"]'));
    }
  });
  return problems;
}

function validateAll() {
  const problems = [];
  const n = document.getElementById("respondentName");
  if (!n.value.trim()) problems.push(n);
  QUESTIONS.forEach(q => {
    if (!form.querySelector('input[name="' + q.id + '"]:checked')) {
      problems.push(form.querySelector('.q[data-qid="' + q.id + '"]'));
    }
  });
  return problems;
}

function flagProblems(problems) {
  problems.forEach(el => {
    if (!el) return;
    if (el.classList.contains("q")) el.classList.add("missing");
    else el.classList.add("missing-input");
  });
  if (problems.length) {
    const first = problems[0];
    if (first) first.scrollIntoView({ behavior: "smooth", block: "center" });
    setAlert("Please answer all items on this page.");
  }
}

function setAlert(msg) { alertBox.textContent = msg || ""; }
function clearAlert()  { alertBox.textContent = ""; }

function buildPayload() {
  const data = new URLSearchParams();
  data.append(CONFIG.nameEntry, document.getElementById("respondentName").value.trim());
  QUESTIONS.forEach(q => {
    const checked = form.querySelector('input[name="' + q.id + '"]:checked');
    data.append(q.entry, checked ? checked.value : "");
  });
  return data;
}

async function sendToGoogleForms() {
  const body = buildPayload();
  await fetch(CONFIG.formAction, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: body.toString()
  });
}

form.addEventListener("change", e => {
  const card = e.target.closest(".q");
  if (card) card.classList.remove("missing");
  clearAlert();
});

form.addEventListener("input", e => {
  if (e.target.id === "respondentName") {
    e.target.classList.remove("missing-input");
    clearAlert();
  }
});

nextBtn.addEventListener("click", () => {
  const problems = validatePage(page);
  if (problems.length) { flagProblems(problems); return; }
  clearAlert();
  showPage(page + 1);
});

prevBtn.addEventListener("click", () => {
  clearAlert();
  showPage(page - 1);
});

submitBtn.addEventListener("click", async () => {
  const problems = validateAll();
  if (problems.length) {
    const first = problems[0];
    const targetPage = first.classList.contains("q")
      ? pageOfQid(first.dataset.qid)
      : 1;
    if (targetPage !== page) showPage(targetPage);
    flagProblems(problems);
    return;
  }

  clearAlert();
  submitBtn.disabled = true;
  submitBtn.textContent = "Submitting…";

  try {
    await sendToGoogleForms();
    form.hidden = true;
    bottomBar.hidden = true;
    doneScreen.hidden = false;
    window.scrollTo({ top: 0, behavior: "smooth" });
  } catch (err) {
    console.error(err);
    submitBtn.disabled = false;
    submitBtn.textContent = "Submit";
    setAlert("Submission failed. Please check your connection and try again.");
  }
});

render();
</script>
</body>
</html>
